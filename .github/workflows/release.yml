name: Release

# 태그 규칙: v2026.10.24 (정식) / v2026.10.24-beta.1 (프리 릴리즈)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 태그 검사, 버전 계산
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          re='^v([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-beta\.([1-9][0-9]*))?$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::태그 형식이 맞지 않음: $tag (예: v2026.10.24, v2026.10.24-beta.1)"
            exit 1
          fi
          # semver는 앞자리 0을 허용하지 않으므로 v2026.01.05 → 2026.1.5
          version="$((10#${BASH_REMATCH[1]})).$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[3]}))"
          prerelease=false
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            version="${version}-beta.${BASH_REMATCH[5]}"
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 앱 버전 지정
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: 빌드
        run: npm run dist

      - name: GitHub 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "${{ steps.meta.outputs.tag }}" --generate-notes)
          if [[ "${{ steps.meta.outputs.prerelease }}" == true ]]; then
            args+=(--prerelease)
          fi
          # latest.yml, blockmap: 설치형 자동 업데이트가 읽는 메타데이터
          gh release create "${{ steps.meta.outputs.tag }}" dist/*.exe dist/*.blockmap dist/latest.yml "${args[@]}"
